name: Run unit tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install gcovr ninja-build

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: v2-${{ runner.os }}-tests

      - name: Build and run tests
        run: |
          cmake . --preset test -B build
          cmake --build build
          ctest --test-dir build --output-junit report.xml

      - uses: test-summary/action@v2
        with:
          paths: "build/report.xml"
          show: "all"
